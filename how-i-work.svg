<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140B2B"/>
      <stop offset="100%" stop-color="#1F0B24"/>
    </linearGradient>
    <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#FF2E88"/>
      <stop offset="50%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#3A86FF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;2400 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2E88"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF2E88"/>
      <stop offset="50%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FFD23F"/>
    </linearGradient>
  </defs>

  <style>
    .row{opacity:0;animation:slide .7s cubic-bezier(.2,.8,.2,1) forwards}
    .r1{animation-delay:.2s}.r2{animation-delay:.5s}.r3{animation-delay:.8s}.r4{animation-delay:1.1s}.r5{animation-delay:1.4s}
    .n{font:800 18px "Segoe UI",Ubuntu,Arial,sans-serif;fill:#fff}
    .h{font:700 22px "Segoe UI",Ubuntu,Arial,sans-serif;fill:#FFFFFF}
    .d{font:400 17px "Segoe UI",Ubuntu,Arial,sans-serif;fill:#C9B8E0}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes slide{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  </style>

  <rect x="2" y="2" width="1196" height="416" rx="18" fill="url(#card)" stroke="url(#border)" stroke-width="2.5"/>

  <rect x="68" y="50" width="3" height="320" rx="1.5" fill="url(#rail)" opacity=".25"/>
  <rect x="68" y="50" width="3" height="0" rx="1.5" fill="url(#rail)">
    <animate attributeName="height" from="0" to="320" begin=".2s" dur="1.6s" fill="freeze"/>
  </rect>

  <g class="row r1">
    <circle cx="70" cy="50" r="22" fill="url(#num)"/>
    <circle cx="70" cy="50" r="28" fill="none" stroke="#FF2E88" stroke-width="1.5" class="pulse"/>
    <text class="n" x="70" y="56" text-anchor="middle">01</text>
    <text class="h" x="120" y="46">Break it down</text>
    <text class="d" x="120" y="72">Turn vague requirements into clear, scoped technical tasks</text>
  </g>
  <g class="row r2">
    <circle cx="70" cy="130" r="22" fill="url(#num)"/>
    <text class="n" x="70" y="136" text-anchor="middle">02</text>
    <text class="h" x="120" y="126">Build it right</text>
    <text class="d" x="120" y="152">Favor clean architecture, separation of concerns, and readable code</text>
  </g>
  <g class="row r3">
    <circle cx="70" cy="210" r="22" fill="url(#num)"/>
    <text class="n" x="70" y="216" text-anchor="middle">03</text>
    <text class="h" x="120" y="206">Plan for growth</text>
    <text class="d" x="120" y="232">Write systems that stay maintainable as features and users scale</text>
  </g>
  <g class="row r4">
    <circle cx="70" cy="290" r="22" fill="url(#num)"/>
    <text class="n" x="70" y="296" text-anchor="middle">04</text>
    <text class="h" x="120" y="286">Keep people in the loop</text>
    <text class="d" x="120" y="312">Communicate progress clearly and respect deadlines</text>
  </g>
  <g class="row r5">
    <circle cx="70" cy="370" r="22" fill="url(#num)"/>
    <circle cx="70" cy="370" r="28" fill="none" stroke="#FFD23F" stroke-width="1.5" class="pulse"/>
    <text class="n" x="70" y="376" text-anchor="middle">05</text>
    <text class="h" x="120" y="366">Own the outcome</text>
    <text class="d" x="120" y="392">Stay accountable from the first planning session to deployment</text>
  </g>
</svg>
