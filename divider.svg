<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 20" width="1200" height="20">
  <defs>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#FF2E88" stop-opacity=".15"/>
      <stop offset="30%" stop-color="#FF8A00"/>
      <stop offset="60%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#3A86FF" stop-opacity=".15"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;2400 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="g" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="9" width="1200" height="2" rx="1" fill="url(#line)"/>
  <circle cy="10" r="4" fill="#FFD23F" filter="url(#g)">
    <animate attributeName="cx" values="-20;1220" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cy="10" r="3" fill="#FF2E88" filter="url(#g)">
    <animate attributeName="cx" values="1220;-20" dur="5.5s" repeatCount="indefinite"/>
  </circle>
</svg>
