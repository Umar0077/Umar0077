<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0A1F">
        <animate attributeName="stop-color" values="#0B0A1F;#160A2E;#0B0A1F" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2A0A3D">
        <animate attributeName="stop-color" values="#2A0A3D;#3D0A2A;#0A1A3D;#2A0A3D" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#FF2E88"/>
      <stop offset="35%" stop-color="#FF8A00"/>
      <stop offset="60%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#3A86FF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;2400 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="o1"><stop offset="0%" stop-color="#FF2E88" stop-opacity=".8"/><stop offset="100%" stop-color="#FF2E88" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2"><stop offset="0%" stop-color="#FF8A00" stop-opacity=".7"/><stop offset="100%" stop-color="#FF8A00" stop-opacity="0"/></radialGradient>
    <radialGradient id="o3"><stop offset="0%" stop-color="#3A86FF" stop-opacity=".7"/><stop offset="100%" stop-color="#3A86FF" stop-opacity="0"/></radialGradient>

    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2E88"/>
      <stop offset="50%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FFD23F"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3A86FF"/>
      <stop offset="100%" stop-color="#FF2E88"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frame"><rect width="1200" height="360"/></clipPath>
  </defs>

  <style>
    .name{font:800 68px "Segoe UI",Ubuntu,"Helvetica Neue",Arial,sans-serif;letter-spacing:1px;opacity:0;animation:rise 1.2s cubic-bezier(.2,.8,.2,1) .2s forwards}
    .sub{font:600 18px "Segoe UI",Ubuntu,Arial,sans-serif;letter-spacing:6px;fill:#FFE3F1;opacity:0;animation:rise 1.2s ease-out .8s forwards}
    .tag{font:700 21px Consolas,"Courier New",monospace;fill:#FFD23F;opacity:0;animation:cycle 12s ease-in-out infinite}
    .t2{animation-delay:3s}.t3{animation-delay:6s}.t4{animation-delay:9s}
    .star{fill:#fff;animation:tw 3s ease-in-out infinite}
    .s2{animation-delay:.8s}.s3{animation-delay:1.6s}.s4{animation-delay:2.4s}
    .grid line{stroke:#FF2E88;stroke-opacity:.18;stroke-width:1}
    @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
    @keyframes cycle{0%{opacity:0;transform:translateY(12px)}4%{opacity:1;transform:translateY(0)}21%{opacity:1;transform:translateY(0)}25%{opacity:0;transform:translateY(-12px)}100%{opacity:0}}
    @keyframes tw{0%,100%{opacity:.1}50%{opacity:1}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>

    <circle cx="180" cy="90" r="220" fill="url(#o1)">
      <animateTransform attributeName="transform" type="translate" values="0 0;80 40;0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="80" r="240" fill="url(#o3)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-90 50;0 0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="300" r="260" fill="url(#o2)" opacity=".6">
      <animateTransform attributeName="transform" type="translate" values="0 0;60 -30;0 0" dur="12s" repeatCount="indefinite"/>
    </circle>

    <g class="grid">
      <g>
        <line x1="0" y1="250" x2="1200" y2="250"/>
        <line x1="0" y1="270" x2="1200" y2="270"/>
        <line x1="0" y1="290" x2="1200" y2="290"/>
        <line x1="0" y1="310" x2="1200" y2="310"/>
        <line x1="0" y1="330" x2="1200" y2="330"/>
        <line x1="0" y1="350" x2="1200" y2="350"/>
        <line x1="0" y1="370" x2="1200" y2="370"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 20" dur="1.6s" repeatCount="indefinite"/>
      </g>
      <line x1="600" y1="240" x2="-400" y2="360"/>
      <line x1="600" y1="240" x2="0" y2="360"/>
      <line x1="600" y1="240" x2="300" y2="360"/>
      <line x1="600" y1="240" x2="600" y2="360"/>
      <line x1="600" y1="240" x2="900" y2="360"/>
      <line x1="600" y1="240" x2="1200" y2="360"/>
      <line x1="600" y1="240" x2="1600" y2="360"/>
    </g>

    <circle class="star" cx="80" cy="40" r="2"/>
    <circle class="star s2" cx="240" cy="150" r="1.5"/>
    <circle class="star s3" cx="390" cy="30" r="2"/>
    <circle class="star s4" cx="510" cy="200" r="1.3"/>
    <circle class="star" cx="760" cy="45" r="1.6"/>
    <circle class="star s2" cx="900" cy="190" r="1.4"/>
    <circle class="star s3" cx="1080" cy="40" r="2"/>
    <circle class="star s4" cx="1150" cy="160" r="1.5"/>

    <text class="name" x="600" y="118" text-anchor="middle" fill="url(#shine)" filter="url(#glow)">Syed Umar Ahmad</text>
    <text class="sub" x="600" y="160" text-anchor="middle">FULL STACK DEVELOPER  •  MOBILE  •  WEB  •  BACKEND</text>

    <text class="tag" x="600" y="212" text-anchor="middle">&gt; Building Flutter apps that actually ship</text>
    <text class="tag t2" x="600" y="212" text-anchor="middle">&gt; Laravel + PHP backends for mobile products</text>
    <text class="tag t3" x="600" y="212" text-anchor="middle">&gt; React frontends with Node.js and FastAPI APIs</text>
    <text class="tag t4" x="600" y="212" text-anchor="middle">&gt; From first idea to production deployment</text>

    <g opacity=".5">
      <path fill="url(#w2)" d="M0 300 Q150 270 300 300 T600 300 T900 300 T1200 300 T1500 300 T1800 300 T2100 300 T2400 300 V360 H0 Z">
        <animateTransform attributeName="transform" type="translate" values="-600 0;0 0" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity=".9">
      <path fill="url(#w1)" d="M0 322 Q150 296 300 322 T600 322 T900 322 T1200 322 T1500 322 T1800 322 T2100 322 T2400 322 V360 H0 Z">
        <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
